name: Security Audit

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  cargo-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        # ksni still depends on zbus 5; remove these informational exceptions
        # once ksni switches to zbus 6. All vulnerabilities still fail the audit.
        run: >-
          cargo audit --deny warnings
          --ignore RUSTSEC-2026-0370
          --ignore RUSTSEC-2026-0371
          --ignore RUSTSEC-2026-0372
