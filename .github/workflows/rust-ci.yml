name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system build dependencies
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev libgtk-4-dev libadwaita-1-dev dbus clang cmake libclang-dev pkg-config

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Cargo check
        run: cargo check --locked

      - name: Cargo test
        run: cargo test --locked

      - name: Test tray fallback without a watcher
        run: dbus-run-session -- cargo test --locked tray::tests::spawn_reports_missing_tray_support -- --ignored
