[package]
name = "vdora"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "GNOME voice-to-paste app with local Whisper transcription"
license = "MIT"
authors = ["Vdora Maintainers"]

[package.metadata.deb]
maintainer = "Vdora Maintainers"
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
  ["target/release/vdora", "usr/bin/", "755"],
]

[dependencies]
anyhow = "1.0"
directories = "6.0"
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_4"] }
hound = "3.5"
nix = { version = "0.31.3", features = ["signal", "process"] }
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
tempfile = "3.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
which = "8.0"
whisper-rs = "0.16"
ksni = { version = "0.3.6", features = ["blocking"] }
ureq = "3.4.2"
