[package]
name = "vdora"
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
description = "Voice-to-paste app with local Whisper transcription"
license = "MIT"
authors = ["Vdora Maintainers"]

[package.metadata.deb]
maintainer = "Vdora Maintainers"
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
  ["target/release/vdora", "usr/bin/", "755"],
]

[dependencies]
anyhow = "1.0"
directories = "6.0"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
tempfile = "3.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
whisper-rs = "0.16"
ureq = "3.5.2"

[dev-dependencies]
hound = "3.5"

[target.'cfg(target_os = "linux")'.dependencies]
hound = "3.5"
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_4"] }
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false }
nix = { version = "0.32.0", features = ["signal", "process"] }
which = "8.0"
ksni = { version = "0.3.7", features = ["blocking"] }

[target.'cfg(windows)'.dependencies]
arboard = { version = "3.7", default-features = false }
cpal = "0.18.2"
windows-sys = { version = "0.61", features = [
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
